<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Sanjeevani Grid - Decentralized National Health Resource Intelligence, Telemetry & Supply Chain Resilience Platform" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    <title>Sanjeevani Grid - Health Resource Intelligence Platform</title>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Sanjeevani Grid SW registered with scope: ', reg.scope),
            (err) => console.warn('Sanjeevani Grid SW registration error: ', err)
          );
        });
      }
    </script>
  </body>
</html>
