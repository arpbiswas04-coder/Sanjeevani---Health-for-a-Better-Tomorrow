services:
  postgres:
    image: postgres:16-alpine
    container_name: sanjeevani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your untracked .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sanjeevani} -d ${POSTGRES_DB:-sanjeevani}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanjeevani-network

  redis:
    image: redis:7-alpine
    container_name: sanjeevani-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanjeevani-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanjeevani-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your untracked .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sanjeevani}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your untracked .env}@postgres:5432/${POSTGRES_DB:-sanjeevani}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanjeevani-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanjeevani-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - sanjeevani-network

networks:
  sanjeevani-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
