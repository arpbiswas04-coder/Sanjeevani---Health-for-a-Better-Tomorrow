# Disposable verification services only; never attaches the application data volume.
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: sanjeevani_test
      POSTGRES_USER: verifier
      POSTGRES_PASSWORD: ${VERIFY_POSTGRES_PASSWORD:?Set a temporary verification password}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifier -d sanjeevani_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
