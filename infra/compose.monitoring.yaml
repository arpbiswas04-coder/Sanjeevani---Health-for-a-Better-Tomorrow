# Merge with compose.yaml; monitor credentials must come from the same CA bundle.
services:
  federation-server:
    ports:
      - '127.0.0.1:9090:9090'
  prometheus:
    image: prom/prometheus:v3.2.1
    user: '${MEMBER4_UID:-1000}'
    network_mode: service:federation-server
    depends_on:
      federation-server:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/federation.yml
      - --storage.tsdb.path=/tmp/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
      - --web.listen-address=0.0.0.0:9090
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    mem_limit: 512m
    pids_limit: 64
    volumes:
      - ./monitoring/prometheus/federation.yml:/etc/prometheus/federation.yml:ro
      - ./monitoring/prometheus/federation-alerts.yml:/etc/prometheus/federation-alerts.yml:ro
      - type: bind
        source: ./federated/secrets/local-dev/monitor
        target: /run/monitor
        read_only: true
        bind:
          create_host_path: false
    restart: 'no'
