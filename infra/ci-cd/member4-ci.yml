# TEMPLATE ONLY: GitHub does not execute workflows from infra/ci-cd/.
# Activation requires a team-approved copy to root .github/workflows/.
name: Member 4 checks

on:
  pull_request:
  push:
    branches: [main, develop, infra/member-4]

permissions:
  contents: read

jobs:
  optimization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q optimization
      - name: Install optional transport solver
        run: python -m pip install ".[transport]"
      - name: Run optimizer and CLI tests
        run: python -m unittest discover -s optimization/tests -v
      - name: Check CLI execution
        run: python -m optimization.redistribution --healthcheck
