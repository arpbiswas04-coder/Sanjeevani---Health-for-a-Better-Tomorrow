# TEMPLATE ONLY: GitHub does not execute workflows from infra/ci-cd/.
# Activation requires a team-approved copy to root .github/workflows/.
name: Member 4 checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop, infra/member-4]

permissions:
  contents: read

jobs:
  optimization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q optimization federated
      - name: Install optional transport solver
        run: python -m pip install ".[transport]"
      - name: Run optimizer and CLI tests
        run: python -m unittest discover -s optimization/tests -v
      - name: Check CLI execution
        run: python -m optimization.redistribution --healthcheck
      - name: Test federation foundation
        run: python -m unittest discover -s federated/tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [transport, federation]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch for federation only
        if: matrix.component == 'federation'
        run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install component and audit tooling
        run: |
          python -m pip install -e ".[${{ matrix.component }}]"
          python -m pip install pip-audit==2.10.1
          mkdir -p outputs/security
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --skip-editable --progress-spinner off --format json --output outputs/security/dependencies-${{ matrix.component }}.json
      - name: Keep available audit report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-dependencies-${{ matrix.component }}
          path: infra/outputs/security/dependencies-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 7

  federation-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build federation image locally (no push)
        run: docker build --file infra/docker/Dockerfile.federation --tag sanjeevani-member4-federation:ci infra
      - name: Prepare report directory
        run: mkdir -p infra/outputs/security
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: sanjeevani-member4-federation:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: infra/outputs/security/federation-image.json
      - name: Keep available image report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-federation-image
          path: infra/outputs/security/federation-image.json
          if-no-files-found: warn
          retention-days: 7
