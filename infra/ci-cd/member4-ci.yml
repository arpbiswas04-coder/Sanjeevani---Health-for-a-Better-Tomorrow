# TEMPLATE ONLY: GitHub does not execute workflows from infra/ci-cd/.
# Activation requires a team-approved copy to root .github/workflows/.
name: Member 4 checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop, infra/member-4]

permissions:
  contents: read

jobs:
  team-scaffolds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend dependencies and static error checks
        run: |
          python -m pip install -r backend/requirements.txt ruff
          python -m ruff check --select E9,F63,F7,F82 backend/app ai
      - name: Existing backend scaffold tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Existing AI placeholder tests (not model acceptance)
        run: python -m pytest ai/tests -q
      - name: Infra monitoring failure paths
        working-directory: infra
        run: python -m unittest discover -s monitoring/tests -q
      - name: Build team images without publishing
        run: |
          docker build -f infra/docker/Dockerfile.backend -t sanjeevani-backend:ci backend
          docker build -f infra/docker/Dockerfile.frontend -t sanjeevani-frontend:ci frontend
      - name: Missing team acceptance gates
        run: |
          echo 'Frontend has no lint/test scripts; AI tests verify placeholders only. Team owners must add these before production approval.' >> "$GITHUB_STEP_SUMMARY"

  optimization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q optimization federated
      - name: Install optional transport solver
        run: python -m pip install ".[transport]"
      - name: Run optimizer and CLI tests
        run: python -m unittest discover -s optimization/tests -v
      - name: Check CLI execution
        run: python -m optimization.redistribution --healthcheck
      - name: Test federation foundation
        run: python -m unittest discover -s federated/tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [transport, federation]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch for federation only
        if: matrix.component == 'federation'
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install component and audit tooling
        run: |
          python -m pip install -e ".[${{ matrix.component }}]"
          mkdir -p outputs/security
          python -m venv outputs/security/audit-venv
          outputs/security/audit-venv/bin/python -m pip install pip-audit==2.10.1
      - name: Audit installed dependencies
        run: |
          python security/audit_requirements.py --output outputs/security/requirements-${{ matrix.component }}.txt
          outputs/security/audit-venv/bin/python -m pip_audit --strict --disable-pip --no-deps --requirement outputs/security/requirements-${{ matrix.component }}.txt --progress-spinner off --format json --output outputs/security/dependencies-${{ matrix.component }}.json
      - name: Keep available audit report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-dependencies-${{ matrix.component }}
          path: |
            infra/outputs/security/dependencies-${{ matrix.component }}.json
            infra/outputs/security/requirements-${{ matrix.component }}.mapping.json
          if-no-files-found: warn
          retention-days: 7

  federation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CPU federation dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[federation]"
      - name: Verify federation adapters, authentication and recovery
        run: python -m unittest discover -s federated/tests -v

  federation-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: federation
            context: infra
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: alertmanager
            context: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build component image locally (no push)
        run: docker build --file infra/docker/Dockerfile.${{ matrix.component }} --tag sanjeevani-member4-${{ matrix.component }}:ci ${{ matrix.context }}
      - name: Prepare report directory
        run: mkdir -p infra/outputs/security
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: sanjeevani-member4-${{ matrix.component }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: infra/outputs/security/${{ matrix.component }}-image.json
      - name: Keep available image report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-${{ matrix.component }}-image
          path: infra/outputs/security/${{ matrix.component }}-image.json
          if-no-files-found: warn
          retention-days: 7
