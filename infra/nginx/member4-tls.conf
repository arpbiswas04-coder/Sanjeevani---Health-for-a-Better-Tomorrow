worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=operations:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=metrics:1m rate=2r/s;
    limit_req_status 429;
    map "$ssl_client_verify:$ssl_client_s_dn" $monitor_allowed {
        default 0;
        "SUCCESS:CN=federation-monitor" 1;
    }
    upstream team_backend { server app-backend:8000; }
    upstream team_frontend { server app-frontend:80; }
    server {
        listen 8081;
        server_name localhost;
        return 308 https://localhost:9443$request_uri;
    }
    server {
        listen 8444 ssl;
        server_name localhost;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate /run/monitor-ca.pem;
        ssl_verify_client optional;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        location = /health/live { return 200 'ok'; }
        location = /internal/metrics { return 404; }
        location = /metrics/ {
            if ($monitor_allowed = 0) { return 403; }
            limit_req zone=metrics burst=2 nodelay;
            proxy_pass http://team_backend/internal/metrics;
        }
        location ~ ^/api/[^/]+/(auth|admin)(/|$) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://team_backend;
        }
        location ~ ^/api/[^/]+/(optimization|recommendations)(/|$) {
            limit_req zone=operations burst=4 nodelay;
            proxy_pass http://team_backend;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://team_backend;
        }
        location / { proxy_pass http://team_frontend; }
    }
}
