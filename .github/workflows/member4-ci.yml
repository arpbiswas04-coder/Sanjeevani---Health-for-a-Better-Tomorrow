name: Member 4 checks

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, infra/ayan]

permissions:
  contents: read

jobs:
  optimization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q optimization federated
      - name: Install optional transport solver
        run: python -m pip install ".[transport]" ruff
      - name: Python static error checks
        run: python -m ruff check --select E9,F63,F7,F82 optimization federated deployment security monitoring
      - name: Run optimizer and CLI tests
        run: python -m unittest discover -s optimization/tests -v
      - name: Check CLI execution
        run: python -m optimization.redistribution --healthcheck
      - name: Monitoring tests
        run: python -m unittest discover -s monitoring/tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [transport, federation, backup]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch for federation only
        if: matrix.component == 'federation'
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install component and audit tooling
        run: |
          python -m pip install -e ".[${{ matrix.component }}]"
          mkdir -p outputs/security
          python -m venv outputs/security/audit-venv
          outputs/security/audit-venv/bin/python -m pip install pip-audit==2.10.1
      - name: Audit installed dependencies
        run: |
          python security/audit_requirements.py --output outputs/security/requirements-${{ matrix.component }}.txt
          outputs/security/audit-venv/bin/python -m pip_audit --strict --disable-pip --no-deps --requirement outputs/security/requirements-${{ matrix.component }}.txt --progress-spinner off --format json --output outputs/security/dependencies-${{ matrix.component }}.json
      - name: Keep available audit report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-dependencies-${{ matrix.component }}
          path: |
            infra/outputs/security/dependencies-${{ matrix.component }}.json
            infra/outputs/security/requirements-${{ matrix.component }}.mapping.json
          if-no-files-found: warn
          retention-days: 7

  federation-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CPU federation dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[federation]"
      - name: Verify federation adapters, authentication and recovery
        run: python -m unittest discover -s federated/tests -v

  federation-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: federation
            context: infra
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: alertmanager
            context: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build component image locally (no push)
        run: docker build --file infra/docker/Dockerfile.${{ matrix.component }} --tag sanjeevani-member4-${{ matrix.component }}:ci ${{ matrix.context }}
      - name: Prepare report directory
        run: mkdir -p infra/outputs/security
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: sanjeevani-member4-${{ matrix.component }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: infra/outputs/security/${{ matrix.component }}-image.json
      - name: Keep available image report on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-${{ matrix.component }}-image
          path: infra/outputs/security/${{ matrix.component }}-image.json
          if-no-files-found: warn
          retention-days: 7

  contracts-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2 pytest pyyaml
      - name: Tracked secret policy
        run: python security/check_tracked_secrets.py
      - name: AI placeholder contracts (not model acceptance)
        working-directory: .
        run: python -m pytest ai/tests -q
      - name: Prepare isolated CI credentials
        run: |
          python -m federated.local provision
          python deployment/prepare_local_env.py
          python deployment/prepare_demo_secrets.py
          python security/prepare_ingress.py
      - name: Validate complete local Compose stack
        run: docker compose -f compose.yaml -f compose.team.yaml -f compose.monitoring.yaml -f compose.grafana.yaml -f compose.observability.yaml -f compose.alerts.yaml -f compose.ingress.yaml config --quiet
      - name: Validate production overlay structure
        run: docker compose -f compose.yaml -f compose.team.yaml -f compose.monitoring.yaml -f compose.grafana.yaml -f compose.observability.yaml -f compose.alerts.yaml -f compose.ingress.yaml -f compose.production.yaml config --quiet
      - name: Isolated real PostgreSQL recovery
        run: |
          docker compose -f compose.yaml -f compose.team.yaml up -d --wait app-postgres
          python deployment/recovery_drill.py
      - name: Preserve synthetic recovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence
          path: infra/outputs/backups/drill-*/report.json
          if-no-files-found: warn
      - name: Stop CI containers (volumes owned by disposable runner)
        if: always()
        run: docker compose -f compose.yaml -f compose.team.yaml down

  runtime-image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: ingress, image: 'nginx:stable-alpine'}
          - {component: postgres, image: 'postgres:16-alpine'}
          - {component: redis, image: 'redis:7-alpine'}
          - {component: prometheus, image: 'prom/prometheus:v3.2.1'}
          - {component: grafana, image: 'grafana/grafana:12.1.0'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: mkdir -p infra/outputs/security
      - name: Scan runtime image with the same strict release policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: infra/outputs/security/${{ matrix.component }}-image.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member4-runtime-${{ matrix.component }}
          path: infra/outputs/security/${{ matrix.component }}-image.json
          if-no-files-found: warn
          retention-days: 7
