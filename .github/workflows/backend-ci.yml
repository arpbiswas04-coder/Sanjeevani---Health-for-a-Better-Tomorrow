name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, infra/ayan]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: ./backend
        run: pytest

      - name: Static errors
        run: |
          python -m pip install ruff
          python -m ruff check --select E9,F63,F7,F82 backend/app

      - name: Audit resolved backend dependencies
        run: |
          python -m venv /tmp/member4-backend-audit
          /tmp/member4-backend-audit/bin/python -m pip install pip-audit==2.10.1
          python infra/security/audit_requirements.py --output /tmp/backend-requirements.txt
          /tmp/member4-backend-audit/bin/python -m pip_audit --strict --disable-pip --no-deps -r /tmp/backend-requirements.txt --format json --output /tmp/backend-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dependency-audit
          path: /tmp/backend-audit.json
          if-no-files-found: warn
          retention-days: 7
